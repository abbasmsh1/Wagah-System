{% extends "base.html" %}

{% block content %}
<h1>Add a New Plane</h1>
<form method="post" action="/transport/plane/add">
    <label for="company">Company:</label>
    <input type="text" id="company" name="company" required><br>

    <label for="flight_number">Flight Number:</label>
    <input type="text" id="flight_number" name="flight_number" required><br>

    <label for="no_of_seats">Number of Seats:</label>
    <input type="number" id="no_of_seats" name="no_of_seats" min="1" required><br>

    <label for="departure_time">Departure Time:</label>
    <input type="time" id="departure_time" name="departure_time" required><br>

    <button type="submit">Add Plane</button>
</form>
{% endblock %}
