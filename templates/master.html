{% extends "base.html" %}

{% block title %}Immigration Form - Wagah System{% endblock %}

{% block content %}
<div class="py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="md:flex md:items-center md:justify-between">
            <div class="flex-1 min-w-0">
                <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                    Immigration Form
                </h2>
                <p class="mt-1 text-sm text-gray-500">
                    Enter passenger details for immigration processing
                </p>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <form method="POST" action="/master/update" class="p-6 space-y-8 divide-y divide-gray-200">
                <!-- Personal Information -->
                <div class="space-y-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">Personal Information</h3>
                    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                        <div class="sm:col-span-2">
                            <label for="its" class="block text-sm font-medium text-gray-700">ITS Number</label>
                            <div class="mt-1">
                                <input type="text" name="its" id="its" required inputmode="numeric"
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.its if master else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-2">
                            <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
                            <div class="mt-1">
                                <input type="text" name="first_name" id="first_name" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.first_name if master else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-2">
                            <label for="middle_name" class="block text-sm font-medium text-gray-700">Middle Name</label>
                            <div class="mt-1">
                                <input type="text" name="middle_name" id="middle_name"
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.middle_name if master else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-3">
                            <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
                            <div class="mt-1">
                                <input type="text" name="last_name" id="last_name" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.last_name if master else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-3">
                            <label for="date_of_birth" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                            <div class="mt-1">
                                <input type="date" name="date_of_birth" id="date_of_birth" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.date_of_birth.strftime('%Y-%m-%d') if master and master.date_of_birth else '' }}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Travel Document Information -->
                <div class="pt-8 space-y-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">Travel Document</h3>
                    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                        <div class="sm:col-span-3">
                            <label for="passport_number" class="block text-sm font-medium text-gray-700">Passport Number</label>
                            <div class="mt-1">
                                <input type="text" name="passport_number" id="passport_number" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.passport_number if master else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-3">
                            <label for="passport_expiry" class="block text-sm font-medium text-gray-700">Passport Expiry</label>
                            <div class="mt-1">
                                <input type="date" name="passport_expiry" id="passport_expiry" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.passport_expiry.strftime('%Y-%m-%d') if master and master.passport_expiry else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-3">
                            <label for="visa_number" class="block text-sm font-medium text-gray-700">Visa Number</label>
                            <div class="mt-1">
                                <input type="text" name="visa_number" id="visa_number" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.visa_number if master else '' }}">
                            </div>
                        </div>

                        <div class="sm:col-span-3">
                            <label for="mode_of_transport" class="block text-sm font-medium text-gray-700">Mode of Transport</label>
                            <div class="mt-1">
                                <select name="mode_of_transport" id="mode_of_transport" required
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md">
                                    <option value="">Select Mode</option>
                                    <option value="bus" {% if master and master.mode_of_transport == 'bus' %}selected{% endif %}>Bus</option>
                                    <option value="train" {% if master and master.mode_of_transport == 'train' %}selected{% endif %}>Train</option>
                                    <option value="plane" {% if master and master.mode_of_transport == 'plane' %}selected{% endif %}>Plane</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="pt-8 space-y-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">Contact Information</h3>
                    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                        <div class="sm:col-span-3">
                            <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                            <div class="mt-1">
                                <input type="tel" name="phone" id="phone"
                                    class="shadow-sm focus-brand block w-full sm:text-sm border-gray-300 rounded-md"
                                    value="{{ master.phone if master else '' }}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="pt-8">
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="window.history.back()"
                            class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-brand">
                            Cancel
                        </button>
                        <button type="submit"
                            class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-brand focus:outline-none focus-brand">
                            Save
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    // Keep the ITS field numeric.
    document.addEventListener('DOMContentLoaded', function () {
        var its = document.getElementById('its');
        if (its) {
            its.addEventListener('input', function () {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        }
    });
</script>
{% endblock %}
{% endblock %}
