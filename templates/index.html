{% extends "base.html" %}

{% block title %}Dashboard - Wagah System{% endblock %}

{% block content %}
<div class="py-16 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto text-center">
        <h1 class="text-4xl tracking-tight font-extrabold text-gray-900 sm:text-5xl md:text-6xl">
            <span class="block">Welcome to</span>
            <span class="block text-brand">Wagah System</span>
        </h1>
        <p class="mt-3 max-w-md mx-auto text-base text-gray-500 sm:text-lg md:mt-5 md:text-xl md:max-w-3xl">
            A comprehensive system for managing border crossings at Wagah Border.
        </p>
        <div class="mt-5 max-w-md mx-auto sm:flex sm:justify-center md:mt-8">
            <div class="rounded-md shadow">
                <a href="/master/" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-white bg-brand md:py-4 md:text-lg md:px-10">
                    Process arrival
                </a>
            </div>
            <div class="mt-3 rounded-md shadow sm:mt-0 sm:ml-3">
                <a href="/master/list/" class="w-full flex items-center justify-center px-8 py-3 border border-brand text-base font-medium rounded-md text-brand bg-white hover:bg-gray-50 md:py-4 md:text-lg md:px-10">
                    View records
                </a>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    // Add any dashboard-specific JavaScript here
    document.addEventListener('DOMContentLoaded', function() {
        // Example: Refresh stats every 5 minutes
        setInterval(function() {
            location.reload();
        }, 300000);
    });
</script>
{% endblock %}
{% endblock %}
